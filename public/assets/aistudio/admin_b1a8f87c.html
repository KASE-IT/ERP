<title>KASE ERP – Administration Module</title>

<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;font:12px 'Segoe UI',Tahoma,Verdana,sans-serif;background:#f3f2f1;color:#201f1e}
header{height:46px;flex-shrink:0;background:#004578;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px}
header>div{display:flex;align-items:center;gap:10px}
.logo{height:30px;max-width:94px;object-fit:contain;background:#fff;padding:2px 5px;border-radius:2px}
.brand-fallback{display:none;background:#fff;color:#004578;padding:6px;font-weight:800}
header input{font:inherit;padding:5px 8px;border:0;border-radius:2px}
#sr{width:220px}
.so{background:none;border:1px solid #8fb8dc;color:#fff;padding:4px 10px;cursor:pointer;font:inherit}
#app{flex:1;display:flex;min-height:0;overflow:hidden}
aside{width:226px;flex-shrink:0;overflow-y:auto;background:#f3f2f1;border-right:1px solid #d2d0ce;padding:6px 0}
.nav-group-head{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:8px 12px 5px;background:transparent;border:0;color:#605e5c;font:700 11px 'Segoe UI',sans-serif;cursor:pointer}
.nav-chevron{font-size:16px;transition:transform .15s}
.nav-group-head[aria-expanded="true"] .nav-chevron{transform:rotate(90deg)}
.nav-items{display:none}
.nav-items.expanded{display:block}
.ni{display:block;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;padding:7px 12px 7px 22px;font:inherit;color:#201f1e;cursor:pointer}
.ni:hover{background:#e8e6e4}
.ni.on{background:#fff;border-left-color:#0078d4;font-weight:600;color:#004578}
#pg{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.tb{background:#fff;padding:8px 16px;border-bottom:1px solid #d2d0ce;min-height:55px}
.cr{font-size:11px;color:#605e5c}
h1{font-size:18px;font-weight:600;margin:1px 0 0}
.sub{font-size:11px;color:#605e5c;margin-top:3px}
.rb{background:#faf9f8;border-bottom:1px solid #d2d0ce;padding:0 12px}
.rt{display:inline-block;color:#0078d4;font-weight:700;font-size:11px;padding:6px 4px 3px;border-bottom:3px solid #0078d4}
.rgs{display:flex;flex-wrap:wrap}
.rg{padding:4px 8px;border-right:1px solid #e1dfdd}
.bs{display:flex;gap:2px}
.rg small{display:block;text-align:center;color:#605e5c;font-size:10px;margin-top:2px}
.rbn{display:flex;flex-direction:column;align-items:center;min-width:58px;max-width:112px;background:none;border:1px solid transparent;padding:3px 6px;font:inherit;font-size:11px;cursor:pointer;color:#201f1e;text-align:center}
.rbn i{font-style:normal;font-size:16px;color:#0078d4}
.rbn:hover{background:#e1dfdd}
.ct{flex:1;overflow:auto;padding:14px 16px}
.fp{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.fp input,.fp select{padding:5px 8px;border:1px solid #8a8886;background:#fff;font:inherit}
.fp input{width:240px}
.tw{overflow-x:auto;background:#fff;border:1px solid #d2d0ce}
table{width:100%;border-collapse:collapse}
th{background:#f3f2f1;color:#605e5c;text-align:left;padding:7px 9px;border-bottom:1px solid #d2d0ce;white-space:nowrap;font-weight:600}
td{padding:7px 9px;border-bottom:1px solid #edebe9;vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#f3f9fd}
.bd{display:inline-block;padding:2px 7px;font-weight:600;font-size:11px;background:#fff4ce;color:#835b00;white-space:nowrap}
.bd.g{background:#dff6dd;color:#0b6a0b}
.bd.r{background:#fde7e9;color:#a4262c}
.bd.b{background:#deecf9;color:#004578}
.card{background:#fff;border:1px solid #d2d0ce;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px;color:#004578}
.cues{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.cue{background:#fff;border:1px solid #d2d0ce;border-top:4px solid #0078d4;padding:10px;cursor:pointer;min-height:78px}
.cue.a{border-top-color:#d83b01}
.cue span{color:#605e5c}
.cue b{display:block;font-size:24px;margin-top:6px;color:#004578}
.cue.a b{color:#d83b01}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr);gap:12px}
.fr{display:flex;justify-content:space-between;padding:5px 0;gap:8px;border-bottom:1px solid #edebe9}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px;padding:12px}
.fd label{display:block;color:#605e5c;font-size:11px;margin-bottom:3px}
.fd input,.fd select,.fd textarea{width:100%;font:inherit;padding:6px 7px;border:1px solid #8a8886;background:#fff}
.fd textarea{min-height:65px;resize:vertical}
.btn{font:inherit;padding:5px 12px;border:1px solid #8a8886;background:#fff;cursor:pointer;margin:0 5px 6px 0;color:#201f1e}
.btn:hover{background:#edebe9}
.btn.p{background:#0078d4;border-color:#0078d4;color:#fff}
.hint,.muted{color:#605e5c;font-size:11px;line-height:1.5}
.he{padding:6px 0;border-bottom:1px solid #edebe9;overflow-wrap:anywhere}
.docline{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #edebe9}
.docmeta{flex:1}
.docicon{font-size:18px;color:#0078d4;width:28px}
.timeline{border-left:2px solid #c8e0f4;margin:8px 0 8px 6px;padding-left:14px}
.timeline .he{position:relative}
.timeline .he:before{content:'';position:absolute;left:-20px;top:10px;width:7px;height:7px;border-radius:50%;background:#0078d4}
.agenda-item{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:8px;border-bottom:1px solid #edebe9}
.agenda-item textarea{width:100%;min-height:48px;border:1px solid #d2d0ce;padding:7px;font:inherit}
.agenda-item textarea:disabled{background:#f3f2f1;color:#605e5c;border-color:#e1dfdd;cursor:not-allowed;opacity:1}
.lock-notice{background:#f3f2f1;border:1px solid #d2d0ce;border-left:4px solid #107c10;padding:10px;margin-bottom:12px}
.empty{padding:24px;text-align:center;color:#605e5c;background:#fff;border:1px solid #d2d0ce}
footer{background:#e1dfdd;color:#605e5c;padding:4px 14px;font-size:11px;display:flex;justify-content:space-between;flex-shrink:0}
#toast{position:fixed;right:16px;bottom:34px;background:#dff6dd;color:#0b6a0b;border:1px solid #107c10;padding:8px 12px;display:none;z-index:90;max-width:440px}
.ov{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:80;padding:12px}
.ov.on{display:flex}
.md{background:#fff;border:1px solid #8a8886;width:92%;max-width:580px;max-height:90vh;overflow:auto;box-shadow:0 8px 28px #0003}
.mh{background:#004578;color:#fff;padding:10px 14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.mb{padding:14px}
.mb input,.mb select,.mb textarea{width:100%;padding:6px 7px;border:1px solid #8a8886;margin:3px 0 12px;font:inherit}
.mb label{font-size:11px;color:#605e5c;display:block}
.login-overlay{background:#eaf0f6;z-index:100}
.login-panel{max-width:430px;border-color:#b9c7d5}
.login-body{padding:26px}
.login-logo{display:flex;align-items:center;justify-content:center;min-height:64px;margin-bottom:14px}
.login-logo img{max-width:210px;max-height:72px;object-fit:contain}
.login-fallback{display:none;background:#004578;color:#fff;padding:14px 20px;font-size:22px;font-weight:800;letter-spacing:2px}

      <div class="fd login-field">

        <b>admin.exec</b><br>
        <b>admin.manager</b>

  </form>
</div>

/* LOGIN: ONLY admin.exec AND admin.manager */

function signIn(e){
 e.preventDefault();
 const username=$('un').value.trim().toLowerCase();

 if(!Object.prototype.hasOwnProperty.call(roles,username)){
  $('le').textContent='Invalid username. Use admin.exec or admin.manager.';
  return;
 }

 role=username;
 $('le').textContent='';
 $('pw').value='';
 $('login').classList.remove('on');

 page='home';
 detail=null;
 expandedGroups=new Set(['Overview']);

 render();
 toast('Signed in as '+roles[role].name);
}

function signOut(){
 $('login').classList.add('on');
 $('un').value='';
 $('pw').value='';
 $('un').focus();
}

function toast(message){
 const t=$('toast');
 t.textContent='✓ '+message;
 t.style.display='block';
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>t.style.display='none',3500);
}

/* NAVIGATION */

function toggleNavGroup(group){
 if(expandedGroups.has(group))expandedGroups.delete(group);
 else expandedGroups.add(group);
 renderNav();
}

function expandGroupForPage(k){
 for(const [group,items] of NAV){
  if(items.some(i=>i[1]===k))expandedGroups.add(group);
 }
}

function renderNav(){
 let html='';

 NAV.forEach(([group,items])=>{
  const open=expandedGroups.has(group);

  html+=`<button class="nav-group-head" onclick="toggleNavGroup('${esc(group)}')" aria-expanded="${open}">
    <span>${esc(group.toUpperCase())}</span><span class="nav-chevron">›</span>
  </button>
  <div class="nav-items ${open?'expanded':''}" style="display:${open?'block':'none'}">
    ${items.map(([label,key,icon])=>`<button class="ni ${page===key&&!detail?'on':''}" onclick="go('${key}')"><span style="display:inline-block;width:20px;color:#0078d4">${icon}</span>${label}</button>`).join('')}
  </div>`;
 });

 $('nav').innerHTML=html;
 $('who').textContent=roles[role].short;
}

function go(k){
 page=k;
 detail=null;
 expandGroupForPage(k);
 render();
}

function openDetail(type,id){
 detail={type,id};
 render();
}

function back(){
 detail=null;
 render();
}

/* UI HELPERS */

function badge(s){
 let c='';
 if(/Approved|Paid|Dispatched|Issued|Active|Finalised|Completed/.test(s))c='g';
 else if(/Returned|Correction|Rejected|Urgent|Reorder/.test(s))c='r';
 else if(/Verified|Processing|Recommended|Scheduled|Submitted|Draft|Awaiting/.test(s))c='';
 else c='b';

 return `<span class="bd ${c}">${esc(s)}</span>`;
}

function btn(label,fn,primary=false){
 return `<button class="btn ${primary?'p':''}" onclick="${fn}">${label}</button>`;
}

function field(label,value){
 return `<div class="fd"><label>${esc(label)}</label><input value="${esc(value)}" disabled></div>`;
}

function table(headers,rows){
 return `<div class="tw"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="muted">No records found.</td></tr>`}</tbody></table></div>`;
}

function listFilter(placeholder,extra=''){
 return `<div class="fp"><label>Search</label><input id="listSearch" placeholder="${placeholder}" oninput="filterRows()">${extra}</div>`;
}

function filterRows(){
 const q=($('listSearch')?.value||'').toLowerCase();
 document.querySelectorAll('#dataTable tbody tr').forEach(tr=>{
  tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none';
 });
}

function claimAction(id,action){
 const c=claims.find(x=>x.id===id);
 if(!c)return;

 if(action==='return'){
  askActionRemarks('claim',id,action,'Return Claim to Employee ESS',
   'Specify the corrections, missing information or supporting documents required from the employee.');
  return;
 }

 performClaimAction(id,action,'');
}

function performClaimAction(id,action,remarks=''){
 const c=claims.find(x=>x.id===id);
 if(!c)return;

 if(action==='verify'){
  if(!c.sanctionRef&&!c.exPostFacto){
   toast('A journey sanction reference or ex-post facto justification is required.');
   return;
  }
  c.status='Verified – Pending Manager Approval';
  c.history.push([dateToday(),roles[role].name,'Claim verified and sent to Administration Manager for approval.']);

 }else if(action==='approve'){
  c.status='Approved – ESS & FICO';
  c.history.push([dateToday(),roles[role].name,'Claim approved. The approved claim is reflected in Employee ESS and Finance / FICO.']);

 }else if(action==='return'){
  if(!remarks.trim()){
   toast('Remarks are mandatory when returning a claim.');
   return;
  }
  c.status='Returned for Correction';
  c.adminRemarks=remarks.trim();
  c.history.push([dateToday(),roles[role].name,'Claim returned to Employee ESS. Remarks: '+remarks.trim()]);
 }

 detail={type:'claim',id};
 render();
 toast('Claim status updated.');
}

 return `

    }).join(''))}

  <div class="card"><h3>Request History & Remarks</h3>

  </div>`;
}

function reqAction(id,action){
 const r=reqs.find(x=>x.id===id);
 if(!r)return;

 if(action==='recommend'){
  askActionRemarks('req',id,action,'Recommend Stock Allocation',
   'Record the basis for recommending allocation from available company stock.');
  return;
 }

 if(action==='return'){
  askActionRemarks('req',id,action,'Return Stock Request',
   'Specify why the request is being returned and what must be corrected or clarified.');
  return;
 }

 performReqAction(id,action,'');
}

function performReqAction(id,action,remarks=''){
 const r=reqs.find(x=>x.id===id);
 if(!r)return;

 if(action==='recommend'){
  if(!remarks.trim()){
   toast('Remarks are mandatory when recommending stock allocation.');
   return;
  }

  for(const l of r.lines){
   if(itemById(l.item).qty<l.qty){
    toast('Insufficient stock for '+itemById(l.item).name+'.');
    return;
   }
  }

  r.status='Recommended by Administration Executive';
  r.adminRemarks=remarks.trim();
  r.history.push([dateToday(),roles[role].name,'Allocation recommended. Remarks: '+remarks.trim()]);

 }else if(action==='approve'){
  r.status='Approved by Administration Manager';
  r.history.push([dateToday(),roles[role].name,'Stock allocation approved by Administration Manager.']);

 }else if(action==='return'){
  if(!remarks.trim()){
   toast('Remarks are mandatory when returning a stock request.');
   return;
  }

  r.status='Returned to Employee ESS';
  r.adminRemarks=remarks.trim();
  r.history.push([dateToday(),roles[role].name,'Stock request returned to employee. Remarks: '+remarks.trim()]);

 }else if(action==='issue'){
  for(const l of r.lines){
   if(itemById(l.item).qty<l.qty){
    toast('Insufficient available stock for '+itemById(l.item).name+'.');
    return;
   }
  }

  for(const l of r.lines){
   const i=itemById(l.item);
   i.qty-=Number(l.qty);
   ledger.unshift({
    date:dateToday(),item:i.name,type:'Distribution',qty:-Number(l.qty),
    ref:r.id,employee:r.requester,by:roles[role].name
   });
  }

  r.status='Issued';
  r.history.push([dateToday(),roles[role].name,'Stock issued to employee; inventory ledger updated.']);
 }

 detail={type:'req',id};
 render();
 toast('Stock request updated.');
}

/* REQUIRED REMARKS DIALOG */

function askActionRemarks(type,id,action,title,instruction){
 pendingRemarkAction={type,id,action};

 modal(title,`
  <p class="hint">${esc(instruction)}</p>
  <label for="actionRemarks">Remarks <span style="color:#a4262c">*</span></label>
  <textarea id="actionRemarks" rows="5" placeholder="Enter remarks..." required></textarea>
  <div id="actionRemarkError" class="login-error" role="alert"></div>
  <div style="text-align:right">
   <button class="btn" onclick="cancelActionRemarks()">Cancel</button>
   <button class="btn p" onclick="submitActionRemarks()">Confirm Action</button>
  </div>
 `);

 setTimeout(()=>$('actionRemarks')?.focus(),50);
}

function submitActionRemarks(){
 const remarks=($('actionRemarks')?.value||'').trim();

 if(!remarks){
  $('actionRemarkError').textContent='Remarks are required to continue.';
  $('actionRemarks').focus();
  return;
 }

 if(!pendingRemarkAction)return;

 const p=pendingRemarkAction;
 pendingRemarkAction=null;
 closeModal();

 if(p.type==='claim'){
  performClaimAction(p.id,p.action,remarks);
 }else{
  performReqAction(p.id,p.action,remarks);
 }
}

function cancelActionRemarks(){
 pendingRemarkAction=null;
 closeModal();
}

  <label>Quantity Received</label><input id="inQty" type="number" min="1" value="1">
  <label>Purchase / GRN Reference</label><input id="inRef" placeholder="e.g. GRN-2026-045">
  <label>Storage Location</label><input id="inLoc" value="Central Store">
  <button class="btn p" onclick="saveStockInflow()">Record Stock Inflow</button>
 `);
}

function saveStockInflow(){
 const item=itemById($('inItem').value);
 const qty=Number($('inQty').value);
 const ref=$('inRef').value.trim()||'GRN-'+Date.now();
 const loc=$('inLoc').value.trim()||item.location;

 if(qty<1){
  toast('Quantity must be greater than zero.');
  return;
 }

 item.qty+=qty;
 item.location=loc;

 ledger.unshift({
  date:dateToday(),item:item.name,type:'Stock Inflow',qty,ref,
  location:loc,by:roles[role].name
 });

 closeModal();
 render();
 toast('Inventory ledger updated.');
}

function saveMeeting(){
 const title=$('mtTitle').value.trim();

 if(!title||!date){
  toast('Meeting title and date are required.');
  return;
 }

 const m={
  id:'BM-2026-'+String(43+meetings.length-2).padStart(3,'0'),
  no:$('mtNo').value,title,date,time:$('mtTime').value,

  agendaStatus:'Draft',agenda:[],mom:'',resolutions:[]

/* AGENDA COLLABORATION
   A finalised agenda is locked and cannot be edited. */

function agendaPage(){
 const m=meetings.find(x=>x.id===agendaMeeting)||meetings[0];
 const finalised=m.agendaStatus==='Finalised';

 const notice=finalised
  ?'<div class="lock-notice"><b>✓ Agenda Finalised</b><br>This agenda is locked and cannot be edited, amended or extended.</div>'
  :'<p class="hint">This agenda is a working draft. Save changes before finalising it.</p>';

 const rows=m.agenda.map((a,i)=>`
  <div class="agenda-item">
   <div style="color:#0078d4;font-weight:bold">${i+1}.</div>
   <textarea id="agenda-${i}" ${finalised?'disabled':''}>${esc(a)}</textarea>
  </div>
 `).join('');

 let controls='';

 if(!finalised){
  controls+=btn('Add Agenda Item','addAgendaItem()');
  controls+=btn('Finalise Agenda','finaliseAgenda()',true);
 }

 controls+=btn('Distribute to Board Portal','distributeAgenda()');

 return `
  <div class="card">
   <h3>Agenda Collaboration Workspace</h3>
   ${notice}

   <div class="fg">
    <div class="fd">
     <label>Board Meeting</label>
     <select id="agendaMeeting" onchange="changeAgendaMeeting(this.value)">
      ${meetings.map(x=>`<option value="${x.id}" ${m.id===x.id?'selected':''}>${esc(x.title)} (${esc(x.date)})</option>`).join('')}
     </select>
    </div>
    <div class="fd">
     <label>Agenda Status</label>
     <input value="${esc(m.agendaStatus)}" disabled>
    </div>
   </div>

   ${rows}

   <div style="padding:12px">${controls}</div>
   <p class="hint">Once finalised, the agenda is read-only. Actual secure distribution requires backend integration.</p>
  </div>`;
}

function changeAgendaMeeting(id){
 agendaMeeting=id;
 render();
}

function openAgendaMeeting(id){
 agendaMeeting=id;
 go('agenda');
}

function addAgendaItem(){
 const m=meetings.find(x=>x.id===agendaMeeting);
 if(!m)return;

 if(m.agendaStatus==='Finalised'){
  toast('This agenda is finalised and cannot be edited.');
  render();
  return;
 }

 saveAgenda(false);
 m.agenda.push('New agenda item');
 render();
 toast('Agenda item added.');
}

function saveAgenda(showToast=true){
 const m=meetings.find(x=>x.id===agendaMeeting);
 if(!m)return false;

 if(m.agendaStatus==='Finalised'){
  toast('This agenda is finalised. Changes are not permitted.');
  render();
  return false;
 }

 m.agenda=m.agenda.map((a,i)=>{
  const input=$('agenda-'+i);
  return input?input.value:a;
 });

 if(showToast)toast('Agenda changes saved.');
 return true;
}

function finaliseAgenda(){
 const m=meetings.find(x=>x.id===agendaMeeting);
 if(!m)return;

 if(m.agendaStatus==='Finalised'){
  toast('This agenda is already finalised and locked.');
  render();
  return;
 }

 if(!saveAgenda(false))return;

 m.agendaStatus='Finalised';
 render();
 toast('Agenda finalised. Editing is now disabled.');
}

function distributeAgenda(){
 const m=meetings.find(x=>x.id===agendaMeeting);
 if(!m)return;

 if(m.agendaStatus!=='Finalised'){
  toast('Finalise the agenda before distributing it.');
  return;
 }

 toast('Agenda distribution is simulated in this prototype.');
}

/* DETAIL ROUTING */

function detailContent(){
 const d=detail;

 if(d.type==='claim')return claimDetail(claims.find(x=>x.id===d.id));
 if(d.type==='req')return reqDetail(reqs.find(x=>x.id===d.id));
 if(d.type==='outward')return outwardDetail(outward.find(x=>x.id===d.id));
 if(d.type==='member')return memberDetail(members.find(x=>x.id===d.id));
 if(d.type==='meeting')return meetingDetail(meetings.find(x=>x.id===d.id));
 if(d.type==='mom')return momDetail(momRecords.find(x=>x.id===d.id));

}

/* MANDATORY ACTION REMARKS */

function askActionRemarks(type,id,action,title,instruction){
 pendingRemarkAction={type,id,action};

 modal(title,`
  <p class="hint">${esc(instruction)}</p>
  <label for="actionRemarks">Remarks <span style="color:#a4262c">*</span></label>
  <textarea id="actionRemarks" rows="5" placeholder="Enter remarks..." required></textarea>
  <div id="actionRemarkError" class="login-error" role="alert"></div>
  <div style="text-align:right">
   <button class="btn" onclick="cancelActionRemarks()">Cancel</button>
   <button class="btn p" onclick="submitActionRemarks()">Confirm Action</button>
  </div>
 `);

 setTimeout(()=>$('actionRemarks')?.focus(),50);
}

function submitActionRemarks(){
 const remarks=($('actionRemarks')?.value||'').trim();

 if(!remarks){
  $('actionRemarkError').textContent='Remarks are required to continue.';
  $('actionRemarks').focus();
  return;
 }

 if(!pendingRemarkAction)return;

 const p=pendingRemarkAction;
 pendingRemarkAction=null;
 closeModal();

 if(p.type==='claim'){
  performClaimAction(p.id,p.action,remarks);
 }else{
  performReqAction(p.id,p.action,remarks);
 }
}

function cancelActionRemarks(){
 pendingRemarkAction=null;
 closeModal();
}

/* GENERAL MODAL */

function modal(title,body){
 $('modalTitle').textContent=title;
 $('modalBody').innerHTML=body;
 $('modal').classList.add('on');
}

function closeModal(){
 $('modal').classList.remove('on');
}

/* SEARCH AND EXPORT */

function globalSearch(value){
 const v=value.trim().toLowerCase();
 if(!v)return;

 const pages={
  'administration dashboard':'home',
  't.a./d.a. claims':'claims',
  'ta/da claims':'claims',
  'digital d.a. register':'daRegister',
  'stock requisitions':'requisitions',
  'inventory ledger':'inventory',
  'outward register':'outward',
  'board members':'members',
  'meetings & agenda':'meetings',
  'agenda collaboration':'agenda',
  'mom & resolutions':'mom'
 };

 if(pages[v]){
  go(pages[v]);
  $('sr').value='';
  return;
 }

 const c=claims.find(x=>(x.id+' '+x.employee+' '+x.purpose).toLowerCase().includes(v));
 if(c){go('claims');openDetail('claim',c.id);return;}

 const r=reqs.find(x=>(x.id+' '+x.requester+' '+x.lines.map(l=>itemById(l.item).name).join(' ')).toLowerCase().includes(v));
 if(r){go('requisitions');openDetail('req',r.id);return;}

 const o=outward.find(x=>(x.id+' '+x.recipient+' '+x.subject).toLowerCase().includes(v));
 if(o){go('outward');openDetail('outward',o.id);return;}

 toast('No matching screen or record found.');
}

function exportTable(){
 const rows=[...document.querySelectorAll('table tr')].map(tr=>
  [...tr.children].map(td=>'"'+td.innerText.replace(/"/g,'""')+'"').join(',')
 ).join('\r\n');

 const a=document.createElement('a');
 const url=URL.createObjectURL(new Blob([rows],{type:'text/csv;charset=utf-8;'}));
 a.href=url;
 a.download='KASE-Administration-Register.csv';
 a.click();
 URL.revokeObjectURL(url);
 toast('Register exported as CSV.');
}

document.addEventListener('input',e=>{
 if(e.target&&e.target.id==='listSearch')filterRows();
});

renderNav();
render();
